  <body class="min-h-screen bg-black text-white overflow-x-hidden" style="font-family:'JetBrains Mono', monospace;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
    // Accent color
    const ACCENT = '#B26CFF';

    // Glitch effect (hover + occasional jitter)
    const glitchEls = document.querySelectorAll('.js-glitch');
    glitchEls.forEach(el => {
      let hoverTimer = null;
      el.addEventListener('mouseenter', () => {
        let c = 0;
        hoverTimer = setInterval(() => {
          const x = (Math.random() * 6 - 3);
          const y = (Math.random() * 6 - 3);
          el.style.transform = `translate(${x}px, ${y}px)`;
          if (++c > 10) c = 0;
        }, 40);
      });
      el.addEventListener('mouseleave', () => {
        clearInterval(hoverTimer);
        el.style.transform = 'translate(0,0)';
      });
    });
    window.addEventListener('scroll', () => {
      glitchEls.forEach(el => {
        if (Math.random() > 0.985) {
          const x = (Math.random() * 4 - 2);
          const y = (Math.random() * 4 - 2);
          el.style.transform = `translate(${x}px, ${y}px)`;
          setTimeout(() => (el.style.transform = 'translate(0,0)'), 100);
        }
      });
    });

    // Typewriter with blinking caret
    const typeEl = document.querySelector('.js-typewriter');
    if (typeEl) {
      const text = 'EXPERIENCIAS DIGITALES SIN FILTROS PARA MARCAS INTRÉPIDAS';
      let i = 0;
      const type = () => {
        if (i <= text.length) {
          typeEl.textContent = text.slice(0, i++);
          setTimeout(type, 22);
        }
      };
      type();
      setInterval(() => {
        const current = typeEl.style.borderRightColor;
        typeEl.style.borderRightColor = current === 'transparent' ? ACCENT : 'transparent';
      }, 500);
    }

    // Random flash blocks
    const flashEls = document.querySelectorAll('.js-flash');
    setInterval(() => {
      flashEls.forEach(el => {
        if (Math.random() > 0.7) {
          const original = el.style.backgroundColor || ACCENT;
          el.style.backgroundColor = '#FFFFFF';
          setTimeout(() => { el.style.backgroundColor = original; }, 110);
        }
      });
    }, 1800);

    // Respect accent on hover outlines for keyboard users
    document.querySelectorAll('button,a').forEach(el => {
      el.addEventListener('focus', () => { el.style.outline = `3px solid ${ACCENT}`; el.style.outlineOffset = '2px'; });
      el.addEventListener('blur', () => { el.style.outline = 'none'; });
    });

    // Accordion
    document.querySelectorAll('[id^="faq-btn-"]').forEach(btn => {
      const panelId = btn.getAttribute('aria-controls');
      const panel = document.getElementById(panelId);
      const icon = btn.querySelector('.js-accordion-icon');

      // Ensure closed on load
      btn.setAttribute('aria-expanded', 'false');
      if (panel) {
        panel.style.maxHeight = '0px';
        panel.style.opacity = '0.8';
      }

      btn.addEventListener('click', () => {
        const isOpen = btn.getAttribute('aria-expanded') === 'true';
        // Close all others for single-open behavior
        document.querySelectorAll('[id^="faq-btn-"]').forEach(otherBtn => {
          const otherPanel = document.getElementById(otherBtn.getAttribute('aria-controls'));
          const otherIcon = otherBtn.querySelector('.js-accordion-icon');
          if (otherBtn !== btn) {
            otherBtn.setAttribute('aria-expanded', 'false');
            if (otherPanel) {
              otherPanel.style.maxHeight = '0px';
              otherPanel.style.opacity = '0.8';
            }
            if (otherIcon) otherIcon.style.transform = 'rotate(0deg)';
          }
        });

        // Toggle current
        btn.setAttribute('aria-expanded', String(!isOpen));
        if (!isOpen) {
          panel.style.maxHeight = panel.scrollHeight + 'px';
          panel.style.opacity = '1';
          if (icon) icon.style.transform = 'rotate(180deg)';
        } else {
          panel.style.maxHeight = '0px';
          panel.style.opacity = '0.8';
          if (icon) icon.style.transform = 'rotate(0deg)';
        }
      });
    });
  </script>
    
  </body>
